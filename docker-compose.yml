# Kural Headless OpenAI-compatible Whisper Transcription Server
# Run locally: docker compose up -d
# Liveness check: curl http://127.0.0.1:7777/health
#
# NOTE: The transcription API does not include authentication.
# By default, ports are bound strictly to 127.0.0.1 (loopback) on the host.
# Do NOT expose port 7777 publicly without an authenticating reverse proxy.

services:
  kural-api:
    image: ghcr.io/mdaashir/kural:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kural-api
    restart: unless-stopped
    ports:
      # Bound to localhost loopback only for security
      - "127.0.0.1:7777:7777"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/home/kural/.cache/huggingface
    volumes:
      # Cache downloaded Whisper models across container restarts
      - kural-models:/home/kural/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7777/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  kural-models:
