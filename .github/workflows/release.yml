name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require existing exact version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess, tomllib
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          tag = os.environ['RELEASE_TAG']
          assert tag == f'v{version}', (tag, version)
          assert subprocess.check_output(['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}']).strip() == subprocess.check_output(['git', 'rev-parse', 'HEAD']).strip()
          PY

  build:
    needs: validate
    uses: ./.github/workflows/build.yml

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            artifacts/kural-windows-x64/*.zip
            artifacts/kural-python-packages/*.whl
            artifacts/kural-python-packages/*.tar.gz
          generate_release_notes: true

  pypi:
    # Opt in only after configuring a protected environment and trusted publisher.
    if: ${{ vars.PUBLISH_PYPI == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kural
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kural-python-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
