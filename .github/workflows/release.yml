name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install pyinstaller

      - name: Run verification test suite
        run: uv run pytest -m "not gpu and not mic" -v

      - name: Build Python distributions (Wheel & sdist)
        run: uv build --out-dir dist

      - name: Build standalone Windows executable with PyInstaller
        run: uv run pyinstaller --noconfirm --clean packaging/kural.spec

      - name: Smoke test standalone executable
        run: |
          dist\kural\kural.exe --version
          dist\kural\kural.exe --doctor

      - name: Archive standalone Windows distribution
        shell: pwsh
        run: |
          Compress-Archive -Path dist\kural\* -DestinationPath dist\kural-windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/kural-windows-x64.zip
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
