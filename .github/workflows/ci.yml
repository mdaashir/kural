name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Format & Test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check code formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint codebase (Ruff)
        run: uv run ruff check .

      - name: Run offline unit tests (pytest)
        run: uv run pytest -m "not gpu and not mic" -v

  build-package:
    name: Build Python Package (Wheel & sdist)
    runs-on: windows-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build distributions
        run: uv build --out-dir dist/packages

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kural-python-packages
          path: dist/packages/
          if-no-files-found: error

  build-application:
    name: Build Standalone Windows Application
    runs-on: windows-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install build dependencies
        run: uv sync --extra dev

      - name: Build standalone executable with PyInstaller
        run: uv run pyinstaller --noconfirm --clean packaging/kural.spec

      - name: Smoke test standalone executable
        run: |
          dist\kural\kural.exe --version
          dist\kural\kural.exe --doctor

      - name: Archive standalone distribution
        shell: pwsh
        run: |
          Compress-Archive -Path dist\kural\* -DestinationPath dist\kural-windows-x64.zip

      - name: Upload Windows Standalone Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kural-windows-x64
          path: dist\kural-windows-x64.zip
          if-no-files-found: error
