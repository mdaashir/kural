# =============================================================================
# KURAL - DEFAULT VOICE COMMANDS
# =============================================================================
# Speak a trigger phrase during command mode to run the associated command.
# Each command needs a "trigger" phrase and one action:
#   "run" (shell command), "hotkey" (keypress), or "type" (deliver pre-written text).

commands:
  # Hotkey commands — send keyboard shortcuts to the active window
  - trigger: "undo"
    hotkey: "ctrl+z"
  - trigger: "select all"
    hotkey: "ctrl+a"
  - trigger: "copy"
    hotkey: "ctrl+c"
  - trigger: "paste"
    hotkey: "ctrl+v"
  - trigger: "paste that"
    hotkey: "ctrl+v"
  - trigger: "snap left"
    hotkey: "win+left"
  - trigger: "snap right"
    hotkey: "win+right"
  - trigger: "maximize"
    hotkey: "win+up"
  - trigger: "minimize"
    hotkey: "win+down"
  - trigger: "show desktop"
    hotkey: "win+d"

  # Shell commands
  - trigger: "open notepad"
    run: "notepad.exe"
  - trigger: "open calculator"
    run: "calc.exe"
  - trigger: "open browser"
    run: "start https://www.google.com"
  - trigger: "open downloads"
    run: 'explorer "%USERPROFILE%\\Downloads"'
  - trigger: "screenshot"
    run: "snippingtool"
  - trigger: "lock screen"
    run: "rundll32.exe user32.dll,LockWorkStation"

  # Tamil & Tanglish voice commands
  - trigger: "திற நோட்பேடு"
    run: "notepad.exe"
  - trigger: "notepad திற"
    run: "notepad.exe"
  - trigger: "notepad open பண்ணு"
    run: "notepad.exe"
  - trigger: "திற கால்குலேட்டர்"
    run: "calc.exe"
  - trigger: "calc open பண்ணு"
    run: "calc.exe"
  - trigger: "திரைப்படம் எடு"
    run: "snippingtool"
  - trigger: "screenshot எடு"
    run: "snippingtool"
  - trigger: "திரையை பூட்டு"
    run: "rundll32.exe user32.dll,LockWorkStation"
  - trigger: "முந்தைய செயல்"
    hotkey: "ctrl+z"
  - trigger: "அனைத்தும் தேர்ந்தெடு"
    hotkey: "ctrl+a"
