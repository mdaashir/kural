# =============================================================================
# KURAL - DEFAULT CONFIGURATION
# =============================================================================
# DO NOT EDIT THIS FILE
# This is the default configuration template for Kural
#
# Personal settings are stored at:
# Windows: %APPDATA%\kural\user_settings.yaml
# macOS: ~/.kural/user_settings.yaml

whisper: # Whisper AI Model Settings
    # Backend engine
    # - faster_whisper (default): CTranslate2-based, GPU-accelerated (RTX 3050)
    backend: faster_whisper

    # Model selection
    # Default is 'large-v3-turbo' on GPU for optimal accuracy and speed (English + Tamil)
    # CPU fallback: 'base' or 'small'
    model: large-v3-turbo

    # Transcription device
    # Options: cuda (NVIDIA RTX 3050), cpu
    device: cuda

    # Compute Precision
    # Options: float16 (for CUDA), int8 (for CPU)
    compute_type: float16

    # Automatically unload model from VRAM after N minutes of inactivity (0 to disable)
    # Frees ~1.5 GB on RTX 3050 for other GPU workloads; reloads seamlessly on next dictation
    idle_unload_minutes: 5

    # Language selection
    # Options: en (English), ta (Tamil), or auto (auto-detect)
    language: en

    # Indic script output style (for Tamil)
    # Options: native (Tamil script characters), roman (Latin transliteration / Tanglish)
    indic_script: native

    # Dictation languages restricted list
    # When language is 'auto', detection picks only from this list
    languages:
        - en
        - ta

    # Transcription quality settings
    beam_size: 5

    # Initial prompt to guide transcription style or script
    initial_prompt: ""

    # Custom hotwords — domain or vocabulary terms the model should favor
    hotwords: []

    # Smart prompt from selection
    prompt_from_selection: false

    # Whisper task: "transcribe" (source language) or "translate" (into English)
    task: transcribe

    # Available models
    models:
        large-v3-turbo:
            label: "Large-V3-Turbo (1.5GB)"
            group: official
            enabled: true
        large:
            label: "Large-V3 (2.9GB)"
            group: official
            enabled: true
        medium:
            label: "Medium (1.4GB)"
            group: official
            enabled: true
        small:
            label: "Small (464MB)"
            group: official
            enabled: true
        base:
            label: "Base (141MB)"
            group: official
            enabled: true
        tiny:
            label: "Tiny (75MB)"
            group: official
            enabled: true
        distil-large-v3.5:
            source: Systran/faster-distil-whisper-large-v3
            label: "Distil-Large-V3.5 (1.5GB)"
            group: custom
            enabled: true

audio: # Audio input configuration
    device: default
    host: null
    max_duration: 30
    channels: 1
    whisper_mode: # Boost quiet speech / whisper mode
        enabled: true
        max_gain: 8.0
    noise_suppression: # Spectral subtraction noise gating (removes fan/HVAC hum)
        enabled: false
        strength: 0.75 # 0.0 to 1.0 (proportion of noise reduction)
    ducking: # Automatic playback volume ducking while dictating
        enabled: false
        factor: 0.25 # Lower volume to 25% of current level while speaking

hotkey: # Hotkey trigger configuration
    recording_hotkey: "ctrl+space"
    stop_key: "ctrl | macos: fn"
    auto_send_key: ""
    command_hotkey: "ctrl+shift+space"
    paste_last_hotkey: "ctrl+alt+v"
    cancel_hotkey: "escape" # Discard recording without transcribing or pasting (Hex-inspired)
    recording_mode: toggle # toggle or push_to_talk
    mouse_button: ""
    double_tap_to_lock: false

clipboard: # Insertion settings
    auto_paste: true
    restore_clipboard: true
    delivery_method: paste # paste (clipboard + Ctrl+V) or type (SendInput Unicode keystrokes)

logging: # Logging configuration
    level: INFO
    log_transcriptions: false
    file:
        enabled: true
        filename: "kural.log"
        max_bytes: 1048576 # 1 MB
        backup_count: 3

vad: # Voice activity detection
    precheck_enabled: true
    realtime_enabled: false
    vad_onset_threshold: 0.7
    vad_offset_threshold: 0.55
    vad_min_speech_duration: 0.1
    vad_silence_timeout_seconds: 20.0

streaming: # Real-time streaming recognizer (optional)
    enabled: false
    deliver_to_cursor: false
    model: standard
    models: {}

postprocess: # Text cleanup and formatting
    remove_stutter: true
    backtrack: true
    format_lists: true
    styles: {}
    corrections: {}
    snippets: # Inline spoken text expansions
        - trigger: "today's date"
          expansion: "${date}"
        - trigger: "current time"
          expansion: "${time}"
        - trigger: "insert clipboard"
          expansion: "${clipboard}"

recovery: # Never-lose-a-dictation audio and text retention
    enabled: true
    max_age_hours: 24 # DPAPI encrypted take expires after N hours

voice_commands: # Voice control engine
    enabled: true
    fuzzy_match: true
    guardrails: true

ui: # User interface preferences
    theme: system

overlay: # Floating visual status pill (Wispr-style screen edge overlay)
    enabled: true
    position: "bottom-center" # bottom-center, top-center
    click_through: true # Allow mouse clicks to pass through to windows below

system_tray: # Windows notification area / tray icon
    enabled: true

audio_feedback: # Audible confirmation cues for recording start/stop/done
    enabled: true
    start_sound: "" # Custom .wav file path, or empty for native chime
    stop_sound: ""
    complete_sound: ""
    error_sound: ""

stats:
    typing_wpm: 40

llm_fallback: # Optional local language model intent fallback (off by default)
    enabled: false
    model_path: "" # Path to local .gguf or ONNX model
    timeout_sec: 6.0

wake_word: # Optional hands-free keyword activation (off by default)
    enabled: false
    trigger_phrase: "kural" # Activation keyword (e.g. "kural" or "குரல்")
    sensitivity: 0.6

notes: # Voice notes and Obsidian vault quick-capture
    vault_path: "" # Path to Obsidian vault or custom notes directory (empty = Documents/Kural Notes)
